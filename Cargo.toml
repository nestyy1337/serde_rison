[package]
name = "serde_rison"
version = "0.1.3"
edition = "2024"
rust-version = "1.85"
description = "A serde implementation for the RISON data format"
license = "MIT"
repository = "https://github.com/nestyy1337/serde_rison"
keywords = ["serde", "rison", "serialization", "deserialization"]
categories = ["encoding", "parser-implementations"]
include = ["src/**", "README.md", "LICENSE"]

[dependencies]
serde = "1.0.69"
serde_json = { version = "1.0.25", optional = true }
zmij = "1.0.23"

[dev-dependencies]
proptest = "1.11.0"
serde = { version = "1.0.69", features = ["derive"] }

[features]
default = []
json = ["serde_json"]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"

[lints.rust]
unsafe_code = "forbid"
