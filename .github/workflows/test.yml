# Test suite on every push to master and every pull request.
# - required: stable and beta, default and all features
# - minimal: oldest dependency versions allowed by Cargo.toml
# - coverage: llvm-cov uploaded to codecov (needs the CODECOV_TOKEN secret)
permissions:
  contents: read
on:
  push:
    branches: [master]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
name: test
jobs:
  required:
    runs-on: ubuntu-latest
    name: ubuntu / ${{ matrix.toolchain }}
    strategy:
      matrix:
        toolchain: [stable, beta]
    steps:
      - uses: actions/checkout@v7
      - name: Install ${{ matrix.toolchain }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
      - name: cargo generate-lockfile
        run: cargo generate-lockfile
      - name: cargo test (default features)
        run: cargo test --locked --all-targets
      - name: cargo test (all features)
        run: cargo test --locked --all-targets --all-features
      # https://github.com/rust-lang/cargo/issues/6669
      - name: cargo test --doc
        run: cargo test --locked --doc --all-features
  minimal:
    runs-on: ubuntu-latest
    name: ubuntu / nightly / minimal versions
    steps:
      - uses: actions/checkout@v7
      - name: Install nightly
        uses: dtolnay/rust-toolchain@nightly
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
      - name: Resolve minimal dependency versions
        run: cargo update -Zminimal-versions
      - name: Test minimal dependency versions
        run: cargo test --locked --all-targets --all-features
      - name: Test documentation
        run: cargo test --locked --doc --all-features
  coverage:
    runs-on: ubuntu-latest
    name: ubuntu / stable / coverage
    steps:
      - uses: actions/checkout@v7
      - name: Install stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - name: cargo install cargo-llvm-cov
        uses: taiki-e/install-action@v2.85.4
        with:
          tool: cargo-llvm-cov
      - name: cargo generate-lockfile
        run: cargo generate-lockfile
      - name: cargo llvm-cov
        run: cargo llvm-cov --locked --all-features --lcov --output-path lcov.info
      - name: Record Rust version
        run: echo "RUST=$(rustc --version)" >> "$GITHUB_ENV"
      - name: Upload to codecov.io
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          env_vars: OS,RUST
