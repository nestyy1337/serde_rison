# Nightly run against the latest nightly toolchain and the latest dependency
# versions, since the crate can break without any change in this repository.
permissions:
  contents: read
on:
  schedule:
    - cron: '7 7 * * *'
  workflow_dispatch:
name: rolling
jobs:
  nightly:
    runs-on: ubuntu-latest
    name: ubuntu / nightly
    steps:
      - uses: actions/checkout@v7
      - name: Install nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --all-targets --all-features
        env:
          RUSTFLAGS: -D deprecated
